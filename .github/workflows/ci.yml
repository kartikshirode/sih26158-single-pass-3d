# The commit gate (docs/14 section 2.1), made automatic.
#
# Everything here runs on CPU in a couple of minutes and needs no data beyond the repo:
# the harness has its own synthetic fixtures, and the pipeline test builds a scene whose
# ground truth it knows. The parts that need run artefacts (the demo build, its design
# and wiring audits) stay a local pre-deploy gate until a small fixture run is committed.
name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PROJ_NETWORK: "ON"        # the geoid grid is fetched; the container ships it instead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # ADR-018: open3d has no 3.13 wheels
          cache: pip

      - name: install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install opencv-python-headless av matplotlib

      - name: syntax
        run: python -m compileall -q src tools mvs_job mapanything_job tesseract.py

      - name: evaluation harness
        run: python src/eval3d/test_metrics.py

      - name: telemetry - every DJI SRT family, and the fuzz (EXP-23)
        run: python src/ingest/test_srt.py

      - name: frame gates on letterboxed footage
        run: python src/ingest/test_frames.py

      - name: local GPU path, the parts that need no GPU
        run: python src/pipeline/test_local_gpu.py

      - name: textured mesh exports (OBJ, GLB; FBX needs assimp and is skipped here)
        run: python src/pipeline/test_mesh_export.py

      - name: unseen faces coloured from the dense cloud
        run: python src/pipeline/test_texture_fill.py

      - name: texture seams levelled outside OpenMVS
        run: python src/pipeline/test_texture_level.py

      - name: MapAnything depth prior, the parts that need no GPU
        run: |
          # Open3D's Linux wheel loads libGL and OpenMP at import.
          sudo apt-get install -y --no-install-recommends libgl1 libgomp1
          pip install open3d numba
          python src/pipeline/test_prior_depth.py 2>&1 | tee prior.log; s=${PIPESTATUS[0]}
          # The tail as an annotation, which the checks API shows without a login.
          if [ "$s" -ne 0 ]; then echo "::error title=test_prior_depth::$(tail -c 1500 prior.log | tr '\n' '|')"; fi
          exit $s

      - name: window fusion
        run: python src/pipeline/test_window_fuse.py

      - name: MVS bundle-adjustment gate (S3b), against the recorded Kolu runs
        run: python mvs_job/test_ba_gate.py

      - name: MVS principal-point guard on a cropped keyframe
        run: python src/pipeline/test_colmap_export.py

      - name: pipeline - contracts, scale, orchestration, end to end
        run: python src/tesseract/test_tesseract.py

      # The public upload API spends real compute per start. Its guards (one start per
      # run id, the daily cap, the signed byte bound) run here against in-memory fakes.
      - name: upload API guards
        run: node --test "demo/test/*.test.js"

      - name: workspace measurement maths
        run: node --test "web/test/geom.test.js"

      - name: a run must satisfy its own contracts
        run: |
          python tesseract.py run synthetic --frames 60 --gnss rtk --name ci
          python tesseract.py verify out/runs/ci

      # demo/ is committed, so the built console is in the repo and can be driven
      # here. It is the only check that can see the WebGL workspace: whether a
      # measurement on a calibrated clip prints metres and the same tool on an
      # unvalidated one prints units.
      - name: the console must say what the manifests say
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tools/test_console.py

      # docs/00 restates ~50 figures that live in eighteen other documents. Nothing
      # breaks when one of them moves, which is exactly why it is checked here.
      - name: the onboarding document must still match its sources
        run: python tools/check_onboarding.py

      - name: licences of anything new must be registered
        run: |
          python - <<'PY'
          import pathlib, re, sys
          reg = pathlib.Path("docs/11-state-of-the-art.md").read_text(encoding="utf-8")
          pins = [l.split("==")[0].strip().lower()
                  for l in pathlib.Path("requirements.txt").read_text().splitlines()
                  if l.strip() and not l.startswith("#")]
          # every pinned dependency should be named somewhere in the licence register
          missing = [p for p in pins if p not in reg.lower()]
          print("registered:", [p for p in pins if p not in missing])
          if missing:
              print("NOT in the licence register (docs/11 section 5):", missing)
              sys.exit(1)
          PY
